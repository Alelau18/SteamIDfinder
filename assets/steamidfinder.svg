<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- rail with ground hatching -->
  <rect x="118" y="202" width="112" height="8" rx="4" fill="#e2e8f0"/>
  <g stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="132" y1="216" x2="124" y2="226"/>
    <line x1="156" y1="216" x2="148" y2="226"/>
    <line x1="180" y1="216" x2="172" y2="226"/>
    <line x1="204" y1="216" x2="196" y2="226"/>
    <line x1="228" y1="216" x2="220" y2="226"/>
  </g>
  <!-- slider block -->
  <rect x="160" y="168" width="54" height="34" rx="7" fill="#fbbf24" stroke="#92400e" stroke-width="4"/>
  <!-- connecting rod = magnifier handle -->
  <line x1="147" y1="125" x2="187" y2="185" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/>
  <!-- lens = crank wheel -->
  <circle cx="100" cy="98" r="54" fill="#ffffff" fill-opacity="0.16" stroke="#f8fafc" stroke-width="16"/>
  <!-- crank arm inside the lens -->
  <line x1="100" y1="98" x2="147" y2="125" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- pivots -->
  <circle cx="100" cy="98" r="9" fill="#f8fafc"/>
  <circle cx="100" cy="98" r="4" fill="#134e4a"/>
  <circle cx="147" cy="125" r="8" fill="#134e4a"/>
  <circle cx="187" cy="185" r="8" fill="#92400e"/>
  <!-- lens glint -->
  <path d="M70 84 A34 34 0 0 1 92 64" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
</svg>
