name: Release

# Pushing a v* tag builds everything and publishes a GitHub Release.
# Running it by hand (Actions → Release → Run workflow) builds the same files as artifacts
# without publishing anything, as a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux tarball + AppImage
    runs-on: ubuntu-latest
    # Build against Ubuntu 22.04's glibc so the binary runs on older distros too.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Work out the version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          scripts/package-linux.sh "$VERSION"
          scripts/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Work out the version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Name the exe
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/steamidfinder.exe "dist/SteamIDfinder-$VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
