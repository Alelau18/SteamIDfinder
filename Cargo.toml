[package]
name = "steamidfinder"
version = "0.1.1"
edition = "2024"
description = "Turn any Steam ID into a Steam profile link, with name, avatar and name history"
license = "MIT"
repository = "https://github.com/Alelau18/SteamIDfinder"
readme = "README.md"
keywords = ["steam", "steamid", "egui"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.36.2", default-features = false, features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
# Only here to turn on the features eframe's defaults would: client-side window decorations
# for Wayland compositors without server-side ones (GNOME), and dlopen()ed libwayland.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita", "wayland-dlopen"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu", "eframe"] }
